<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6f42c1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gestore">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Gestore</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="topbar">
        <div class="topbar-content">
            <div class="logo">
                <span class="logo-icon">💰</span>
                <span class="logo-text">Gestore</span>
            </div>
            <button class="btn-icon" id="btnRefresh" title="Actualizar">🔄</button>
        </div>
        <div class="tasa-info" id="tasaInfo">Consultando tasa BCV...</div>
    </header>

    <!-- Pestañas -->
    <nav class="tabs">
        <button class="tab active" data-tab="facturas">
            <span class="tab-icon">📋</span>
            <span class="tab-label">Facturas</span>
            <span class="badge hidden" id="badgeFacturas">0</span>
        </button>
        <button class="tab" data-tab="pagos">
            <span class="tab-icon">💸</span>
            <span class="tab-label">Pagos</span>
        </button>
    </nav>

    <!-- Contenido -->
    <main>
        <!-- FACTURAS -->
        <section id="seccionFacturas" class="seccion">
            <div class="stats-grid">
                <div class="stat-card stat-amarillo">
                    <div class="stat-label">Pendientes</div>
                    <div class="stat-value" id="statPendientes">0</div>
                    <div class="stat-sub" id="statPendientesUSD">$0.00</div>
                    <div class="stat-mini" id="statPendientesBs">0,00 Bs</div>
                </div>
                <div class="stat-card stat-rojo">
                    <div class="stat-label">Vencidas</div>
                    <div class="stat-value" id="statVencidas">0</div>
                    <div class="stat-sub" id="statVencidasUSD">$0.00</div>
                    <div class="stat-mini" id="statVencidasBs">0,00 Bs</div>
                </div>
                <div class="stat-card stat-gris">
                    <div class="stat-label">Pagadas</div>
                    <div class="stat-value" id="statPagadas">0</div>
                    <div class="stat-sub" id="statPagadasUSD">$0.00</div>
                    <div class="stat-mini" id="statPagadasBs">0,00 Bs</div>
                </div>
            </div>

            <div class="filtros">
                <input type="text" id="buscarFacturas" placeholder="🔍 Buscar proveedor..." class="input-buscar">
                <select id="filtroEstatusFacturas" class="select-filtro">
                    <option value="activas" selected>Vencidas + Pendientes</option>
                    <option value="vencidas">Solo Vencidas</option>
                    <option value="pendientes">Solo Pendientes</option>
                    <option value="pagadas">Solo Pagadas</option>
                    <option value="todas">Todas</option>
                </select>
                <div class="filtros-chips" id="chipsOrdenFacturas">
                    <button class="chip active" data-orden="fecha">📅 Fecha</button>
                    <button class="chip" data-orden="proveedor">🏢 Proveedor</button>
                    <button class="chip" data-orden="monto">💵 Monto</button>
                    <button class="chip" data-orden="dias">⏰ Días</button>
                </div>
            </div>

            <div id="listaFacturas" class="lista"></div>
        </section>

        <!-- PAGOS -->
        <section id="seccionPagos" class="seccion hidden">
            <div class="stats-grid">
                <div class="stat-card stat-azul">
                    <div class="stat-label">Total Pagado</div>
                    <div class="stat-value" id="statTotalPagos">0,00 Bs</div>
                    <div class="stat-sub" id="statTotalPagosUSD">$0.00</div>
                </div>
                <div class="stat-card stat-verde">
                    <div class="stat-label">Este Mes</div>
                    <div class="stat-value" id="statPagosMes">0</div>
                    <div class="stat-sub" id="statPagosMesUSD">$0.00</div>
                    <div class="stat-mini" id="statPagosMesBs">0,00 Bs</div>
                </div>
            </div>

            <div class="filtros">
                <input type="text" id="buscarPagos" placeholder="🔍 Buscar beneficiario..." class="input-buscar">
                <div class="filtros-chips" id="chipsOrdenPagos">
                    <button class="chip active" data-orden="fecha">📅 Fecha</button>
                    <button class="chip" data-orden="beneficiario">👤 Beneficiario</button>
                    <button class="chip" data-orden="monto">💵 Monto Bs</button>
                    <button class="chip" data-orden="montoUSD">💵 Monto USD</button>
                </div>
            </div>

            <div id="listaPagos" class="lista"></div>
        </section>
    </main>

    <!-- Botón flotante: Nueva Factura -->
    <button class="fab hidden" id="fabNuevaFactura" title="Nueva Factura">+</button>

    <!-- Modal: Formulario de Factura -->
    <div class="modal-overlay hidden" id="modalFactura">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitulo">Nueva Factura</h3>
                <button class="btn-cerrar" id="btnCerrarModal">✕</button>
            </div>
            <div class="modal-body">
                <!-- Botón de foto -->
<div id="seccionFoto" style="text-align: center; margin-bottom: 15px;">
    <input type="file" id="inputFoto" accept="image/*" capture="environment" style="display:none;">
    <button type="button" id="btnTomarFoto" class="btn btn-secondary" style="width: 100%; padding: 14px; font-size: 15px; background: #17a2b8; color: white; border: none; border-radius: 8px; cursor: pointer;">
        📷 Tomar Foto de Factura
    </button>
    <div id="estadoFoto" style="display: none; margin-top: 10px; font-size: 13px; color: #17a2b8; font-weight: 600;">
        ⏳ Procesando imagen...
    </div>
    <div id="previewFoto" style="margin-top: 10px; display: none;">
        <img id="imgPreview" style="max-width: 100%; max-height: 200px; border-radius: 8px; border: 2px solid #17a2b8;">
    </div>
</div>
                <label>Fecha:</label>
                <input type="date" id="formFecha" required>

                <label>Proveedor:</label>
                <input type="text" id="formProveedor" placeholder="Ej: AGRO INDUSTRIAS..." required>

                <label>N° Factura:</label>
                <input type="text" id="formNumeroFactura" placeholder="Ej: 00123">
                <div class="checkbox-inline">
                    <input type="checkbox" id="formSinNumero">
                    <label for="formSinNumero">Sin número</label>
                </div>

                <label>Monto (USD):</label>
                <div class="input-prefix">
                    <span>$</span>
                    <input type="number" id="formMontoUSD" step="0.01" placeholder="102.84" required>
                </div>

                <div class="equivalente-bs" id="equivalenteBs">💱 Equivalente en Bs: --</div>

                <label>Estatus:</label>
                <select id="formEstatus">
                    <option value="Pendiente">Pendiente</option>
                    <option value="Pagada">Pagada</option>
                    <option value="Vencida">Vencida</option>
                </select>

                <label>Notas (opcional):</label>
                <textarea id="formNotas" placeholder="Ej: Factura de leche pasteurizada..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancelar" id="btnCancelarFactura">Cancelar</button>
                <button class="btn btn-primary" id="btnGuardarFactura">💾 Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal: Detalle de Factura/Pago -->
    <div class="modal-overlay hidden" id="modalDetalle">
        <div class="modal">
            <div class="modal-header">
                <h3 id="detalleTitulo">Detalle</h3>
                <button class="btn-cerrar" id="btnCerrarDetalle">✕</button>
            </div>
            <div class="modal-body" id="detalleContenido"></div>
            <div class="modal-footer" id="detalleAcciones"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast hidden" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>

    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('✅ SW registrado:', reg.scope))
                    .catch(err => console.error('❌ SW error:', err));
            });
        }
    </script>
</body>
</html>
